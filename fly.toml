# Fly.io: `fly launch --no-deploy --copy-config`, `fly volumes create gotrip_data --size 1`,
# `fly secrets set JWT_SECRET=$(openssl rand -hex 32) ADMIN_PHONE=017XXXXXXXX ADMIN_PASSWORD=...`, `fly deploy`
app = "go-trip-bd"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/gotrip.db"
  TRUST_PROXY = "1"

[mounts]
  source = "gotrip_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
